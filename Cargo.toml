[package]
name = "litecode-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "litecode-agent"
path = "src/main.rs"

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"
tokio = { version = "1.42.0", features = ["full"] }
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
clap = { version = "4.5.23", features = ["derive"] }
once_cell = "1.20.2"
glob = "0.3.1"
regex = "1.11.1"
anyhow = "1.0.93"
portable-pty = "0.8.1"
vt100 = "0.15.2"

[dev-dependencies]
proptest = "1.5.0"
tempfile = "3.14.0"
wiremock = "0.6.2"
tokio-test = "0.4.4"
